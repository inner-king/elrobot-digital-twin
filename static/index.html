<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElRobot Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,300..600,0..1,0&display=block" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --bg2:#f6f7f9; --bg3:#eef0f3; --line:#e4e7ec; --line2:#d3d8df;
  --ink:#1b1f24; --ink2:#59616d; --ink3:#949ba6;
  --accent:#e8590c; --accent-soft:#fff1e8; --ok:#2f9e44; --bad:#e03131; --info:#1c7ed6;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
.ic{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:18px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;vertical-align:middle;user-select:none;flex:none}
.ic.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20}
html,body{height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
button.small .ic{font-size:16px}
button.icon{padding:0;width:32px;height:32px}
button.icon.small{width:26px;height:26px}
.chip{display:inline-flex;align-items:center;gap:5px;font:12px var(--mono);color:var(--ink2);padding:4px 9px;border-radius:999px;background:var(--bg2)}
.chip .ic{font-size:16px;color:var(--ink3)}
.lbl{display:inline-flex;align-items:center;gap:6px}
.lbl .ic{font-size:17px;color:var(--ink3)}
button:hover{background:var(--bg2)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
button.primary:hover{background:#343a42}
button.small{font-size:12px;padding:3px 9px}
input[type=number],input[type=text]{font:12px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:6px 8px}
input[type=number]{width:80px}
.mono{font-family:var(--mono)}
.muted{color:var(--ink3)}

.app{display:grid;grid-template-rows:50px 1fr var(--bottom-h,220px);grid-template-columns:280px 1fr 380px;height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line)}
.brand{font:600 14px var(--sans);display:flex;align-items:center;gap:6px}
.status{display:flex;align-items:center;gap:7px;font:12px var(--mono);color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)} .dot.warn{background:var(--accent)}
.spacer{flex:1}
.estop{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600;padding:6px 16px}
.estop:hover{background:#c92a2a}

aside{overflow:auto;background:var(--bg)}
#left{border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.lpane{display:none;overflow:auto;flex:1;min-height:0}
.lpane.on{display:block}
#right{border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.list-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.list-h h3{font:600 12px var(--sans);color:var(--ink2);display:flex;align-items:center;gap:6px}
.list-h h3 .ic{font-size:17px;color:var(--ink3)}

.motor{padding:10px 16px;cursor:pointer;border-left:3px solid transparent}
.motor:hover{background:var(--bg2)}
.motor.sel{background:var(--bg2);border-left-color:var(--accent)}
.mrow{display:flex;align-items:center;gap:10px}
.mid{font:600 12px var(--mono);width:14px;color:var(--ink2)}
.motor.sel .mid{color:var(--accent)}
.mname{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mval{font:500 14px var(--mono);text-align:right}
.tog{width:32px;height:18px;border-radius:999px;background:var(--line2);position:relative;border:none;padding:0;flex:none}
.tog:hover{background:var(--line2)}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
.tog.on{background:var(--accent)}
.tog.on::after{left:16px}
.chev{width:12px;color:var(--ink3);font-size:10px;transition:transform .15s}
.motor.open .chev{transform:rotate(90deg)}
.acc{display:none;margin:10px 0 4px 22px}
.motor.open .acc{display:block}
.acc .top{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3)}
.acc .top .v{font:500 12px var(--mono);color:var(--ink)}
.rng{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--ink3);margin-top:-2px}
.slider-wrap{position:relative;height:18px;margin-top:2px}
.slider-wrap input{width:100%;position:relative;z-index:2;-webkit-appearance:none;appearance:none;background:transparent;height:18px}
.slider-wrap input::-webkit-slider-runnable-track{height:3px;background:var(--line);border-radius:2px}
.slider-wrap input::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);margin-top:-5px;border:2px solid #fff;box-shadow:0 0 0 1px var(--accent)}
.slider-wrap input:disabled::-webkit-slider-thumb{background:var(--ink3);box-shadow:0 0 0 1px var(--ink3)}
.live-mark{position:absolute;top:3px;width:2px;height:12px;background:var(--info);z-index:1;pointer-events:none}

main{position:relative;background:#cfd8e2;overflow:hidden}
#view{position:absolute;inset:0}
.vbtns{position:absolute;right:12px;top:12px}
.vbtns button{font-size:12px;padding:4px 10px;background:rgba(255,255,255,.85)}
.hint{position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--ink3);pointer-events:none;display:flex;gap:12px}
.hint span{display:inline-flex;align-items:center;gap:3px}.hint .ic{font-size:15px}
.simhud{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);display:none;gap:6px;align-items:center;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:5px 8px;box-shadow:0 4px 14px rgba(20,24,30,.08)}
.simhud.show{display:flex}
.insets{position:absolute;right:12px;bottom:34px;display:flex;gap:8px;pointer-events:none}
.insets .iv{width:min(232px,24vw);aspect-ratio:4/3;border:1px solid var(--line2);border-radius:8px;position:relative;background:transparent;box-shadow:0 4px 14px rgba(20,24,30,.12)}
.insets .iv span{position:absolute;left:6px;top:4px;font:600 11px var(--sans);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.insets .iv em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:12px var(--sans);color:var(--ink3);font-style:normal}
.insets.off .iv{display:none}
.gzbar{position:absolute;left:12px;top:12px;display:none;gap:4px;align-items:center;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:4px 6px;box-shadow:0 4px 14px rgba(20,24,30,.08);font:12px var(--sans)}
.gzbar.show{display:flex}
.gzbar .k{font:600 12px var(--sans);padding:2px 6px;color:var(--ink2)}
.gzbar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.placebar{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);display:none;white-space:nowrap;gap:6px;align-items:center;background:rgba(255,255,255,.95);border:1px solid #1c7ed6;border-radius:999px;padding:5px 8px 5px 12px;box-shadow:0 4px 14px rgba(28,126,214,.15);font:12px var(--sans)}
.placebar.show{display:flex}
.placebar button,.gzbar button{white-space:nowrap;flex:none}
.placebar .d{font:600 12px var(--mono, monospace);color:#1c7ed6;white-space:nowrap}
.simhud .chip{background:none;padding:2px 6px;white-space:nowrap}
.simhud .vd{font:600 12px var(--sans);padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap}

.dock{display:flex;flex-direction:column;min-height:0;min-width:0}
.dock-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.tabs{display:flex;align-items:center;padding:0 6px 0 12px;border-bottom:1px solid var(--line);flex:none}
.tablist{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto}
.empty{margin:auto;font-size:12px;color:var(--ink3)}
.plus-wrap{position:relative;flex:none}
.plus{width:28px;height:28px;padding:0;border:none;border-radius:6px;background:none;font:400 18px/1 var(--sans);color:var(--ink3)}
.plus:hover,.plus.on{background:var(--bg3);color:var(--ink)}
.menu{display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:30;min-width:170px;background:var(--bg);border:1px solid var(--line2);border-radius:9px;box-shadow:0 8px 24px rgba(20,24,30,.12);padding:6px}
.menu.show{display:block}
footer.dock .menu{top:auto;bottom:calc(100% + 4px)}
.menu label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.menu label:hover{background:var(--bg2)}
.menu label .where{margin-left:auto;font-size:11px;color:var(--ink3)}
.menu .mh{font-size:11px;color:var(--ink3);padding:4px 8px 6px}
.tab{border:none;border-radius:0;background:none;padding:12px 7px 10px;color:var(--ink3);font-weight:500;border-bottom:2px solid transparent;gap:5px;white-space:nowrap;flex:none}
.tab .ic{font-size:18px}

.tab:hover{background:none;color:var(--ink2)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.pane{display:none;overflow:auto;flex:1;min-height:0;padding:18px 18px 28px}
footer .pane{padding:12px 18px 14px}
.pane.on{display:block}
.pane h4{font:600 12px var(--sans);color:var(--ink2);margin:22px 0 8px;display:flex;align-items:center;gap:6px}
.pane h4 .ic{font-size:17px;color:var(--ink3)}
.isteps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
.isteps span{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--bg2);border-radius:999px;padding:3px 9px}
.isteps .ic{font-size:16px;color:var(--accent)}
.btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pane h4:first-child{margin-top:0}

.hero{display:flex;align-items:baseline;justify-content:space-between}
.hero .t{font:600 15px var(--sans)}
.hero .s{font-size:12px}
.deg{font:500 34px var(--mono);margin:6px 0 2px;letter-spacing:-.02em}
canvas.spark{display:block;width:100%;height:64px;margin-top:10px}
.legend{display:flex;gap:12px;font-size:11px;color:var(--ink3);margin-top:4px}
.legend i{display:inline-block;width:10px;height:2px;margin-right:4px;vertical-align:middle}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:16px}
.metric{background:var(--bg);padding:9px 10px}
.metric .k{font-size:11px;color:var(--ink3)}
.metric .v{font:500 14px var(--mono)}
.note{margin-top:12px;padding:9px 11px;border-radius:7px;background:var(--accent-soft);color:#a33f08;font-size:12px}
.note.bad{background:#fff0f0;color:var(--bad)}
details{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;font-size:12px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 12px;font:12px var(--mono);margin-top:8px}
.kv .k{color:var(--ink3);white-space:nowrap}
.kv .v{text-align:right;overflow-wrap:anywhere}
.kv .grp{grid-column:1/-1;font:600 11px var(--sans);color:var(--ink2);margin-top:10px}

.card{border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.active-name{font:600 14px var(--mono)}
.files{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.file{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.file:first-child{border-top:none}
.file .n{flex:1;font:12px var(--mono);overflow:hidden;text-overflow:ellipsis}
.file.act{background:var(--bg2)}
.file .tagon{font-size:11px;color:var(--ok);font-weight:600}
.newrow{display:flex;gap:6px}
.newrow input{flex:1}
.crow{display:grid;grid-template-columns:22px 1fr 44px;gap:8px;align-items:center;margin:7px 0;font:12px var(--mono)}
.cbar{position:relative;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.cbar .fill{position:absolute;top:0;bottom:0;background:#ffd8bf;border-left:2px solid var(--accent);border-right:2px solid var(--accent)}
.cbar .peak{position:absolute;top:0;bottom:0;background:#ffe8d9}
.cbar .cur{position:absolute;top:0;bottom:0;width:2px;background:var(--info)}
.cbar .exp{position:absolute;top:0;bottom:0;border:1px dashed var(--ink3)}
.steps{font-size:12px;color:var(--ink2);padding-left:18px;margin:6px 0 10px}
.ctable{width:100%;border-collapse:collapse;font:12px var(--mono)}
.ctable th{font:500 11px var(--sans);color:var(--ink3);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.ctable td{padding:5px 6px;border-bottom:1px solid var(--line)}
pre.raw{font:11px/1.55 var(--mono);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;max-height:340px;white-space:pre;color:var(--ink2)}
.setrow{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.log{font:11px/1.65 var(--mono);color:var(--ink2);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-height:420px;overflow:auto}
footer{grid-column:1/-1;border-top:1px solid var(--line)}
.ctrl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 18px}
.cell{padding:6px 8px}
.cell .top{display:flex;align-items:baseline;gap:6px;font-size:12px}
.cell .top .nm{font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .top .v{font:500 12px var(--mono)}
.cell .top .id{font:600 11px var(--mono);color:var(--ink3)}

.logpane{font:11px/1.65 var(--mono);color:var(--ink2)}
input[type=range].plain{-webkit-appearance:none;appearance:none;background:transparent;height:18px}
input[type=range].plain::-webkit-slider-runnable-track{height:3px;background:var(--line2);border-radius:2px}
input[type=range].plain::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ink);margin-top:-5px;border:2px solid #fff;box-shadow:0 0 0 1px var(--ink)}
.modal{position:fixed;inset:0;background:rgba(20,24,30,.35);display:none;align-items:center;justify-content:center;z-index:50}
.modal.show{display:flex}
.modal .box{width:min(1060px,96vw);height:min(88vh,920px);background:var(--bg);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.modal .head{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 8px 0 16px}
.modal .head .ttl{font-weight:600;margin-right:16px;display:flex;align-items:center;gap:6px}
.modal .body{flex:1;overflow:auto;padding:14px 18px 24px}
.pg-legend{display:flex;gap:6px;margin-bottom:8px}
.pg{position:relative;margin:0 auto}
.pg-edges{position:absolute;left:0;top:0;overflow:visible}
.pg-edges path{fill:none;stroke:var(--line2);stroke-width:1.6}
.pg-edges path.on{stroke:#adb5bd;stroke-dasharray:6 5;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-11}}
.pg-edges text{font:10px var(--mono);fill:var(--ink3);paint-order:stroke;stroke:var(--bg);stroke-width:4px;text-anchor:middle}
.pn{position:absolute;border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:10px;background:var(--bg);padding:8px 9px;cursor:pointer;transition:box-shadow .15s}
.pn:hover{box-shadow:0 4px 14px rgba(20,24,30,.10)}
.pn.sel{box-shadow:0 0 0 2px var(--ink)}
.pn.t-taco{border-left-color:#1c7ed6}.pn.t-ours{border-left-color:var(--accent)}.pn.t-ext{border-left-color:#2f9e44}
.pn-h{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
.pn-h .ic{font-size:20px;color:var(--ink2)}
.pn.on .pn-h .ic{color:var(--ink)}
.pn-live{font:11px/1.35 var(--mono);color:var(--ink2);margin-top:5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pn-live .off{color:var(--ink3)}
.pn .st{position:absolute;right:8px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--line2)}
.pn.on .st{background:var(--ok)}
.pg-detail{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:84px}
.pg-detail .h{display:flex;align-items:center;gap:7px;font-weight:600}
.pg-detail .row{display:flex;gap:8px;margin-top:8px;font:12px/1.5 var(--mono);color:var(--ink2)}
.pg-detail .row .ic{font-size:17px;color:var(--ink3)}
.tag{display:inline-flex;align-items:center;gap:3px;font:600 10px var(--sans);padding:2px 7px;border-radius:5px}
.tag.taco{background:#e7f5ff;color:#1c7ed6}.tag.ours{background:var(--accent-soft);color:#a33f08}.tag.ext{background:#ebfbee;color:#2b8a3e}
.ctxmenu{position:fixed;z-index:40;background:var(--bg);border:1px solid var(--line2);border-radius:8px;box-shadow:0 8px 24px rgba(20,24,30,.14);padding:4px;display:none;min-width:140px}
.ctxmenu button{display:flex;justify-content:flex-start;width:100%;text-align:left;border:none;border-radius:6px;padding:7px 10px;background:none}
.ctxmenu button:hover{background:var(--bg2)}
main canvas.hover{cursor:pointer}
.vgizmo{position:absolute;right:10px;top:48px;width:92px;height:92px}
.vgizmo circle{cursor:pointer}
.vgizmo text{font:600 10px var(--sans);fill:#fff;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.objs .it{display:flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;border-left:3px solid transparent}
.objs .it:hover,.objs .it.hov{background:var(--bg2)}
.objs .it.sel{background:var(--bg2);border-left-color:var(--accent)}
.objs .it .ic{font-size:19px;color:var(--ink2)}
.objs .it .sw{width:12px;height:12px;border-radius:3px;flex:none}
.objs .it .nm{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.objs .it .meta{font:11px var(--mono);color:var(--ink3)}
.objs .it .st{font:600 11px var(--sans);color:var(--accent)}
.objs .it button{padding:3px 8px}
.objs .gh{font:600 11px var(--sans);color:var(--ink3);padding:12px 16px 4px}
.olabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.olabel{position:absolute;transform:translate(-50%,-100%);background:rgba(27,31,36,.82);color:#fff;font:600 11px var(--sans);padding:2px 7px;border-radius:999px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.olabel .c{font:10px var(--mono);opacity:.7}
.olabel.trk{background:rgba(232,89,12,.85)}
textarea.vocab{width:100%;height:110px;font:11px/1.5 var(--mono);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;resize:vertical}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:#fff;font-size:11px;padding:5px 8px;border-radius:6px;display:none;white-space:nowrap}
.tip .ic{font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;display:none;z-index:20}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="ic f" style="color:var(--accent);font-size:22px">precision_manufacturing</span>ElRobot</div>
    <div class="chip" title="로봇 연결"><span class="dot" id="conn"></span><span class="ic" id="link-ic">cable</span><span id="port">—</span></div>

      <div class="top"><span>각도</span><span class="v">—</span></div>
      ${SLIDER_HTML}
    </div>`;
  el.querySelector('.mrow').addEventListener('click', e => { if(e.target.closest('.tog')) return; toggleOpen(m.id); });
  el.querySelector('.tog').addEventListener('click', () => send({type:'torque', id:m.id, on:!S?.ram?.[m.id]?.torque}));

let openId = null;
function toggleOpen(id){
  openId = openId === id ? null : id;
  document.querySelectorAll('.motor').forEach(e => e.classList.toggle('open', +e.dataset.id === openId));
  select(id);
}
function select(id){
  sel = id;
  document.querySelectorAll('.motor').forEach(e => e.classList.toggle('sel', +e.dataset.id === id));
  paintRobot(); if(S) renderPanels('motor');
}
function renderList(){
  let online = 0;
  for(const m of MOTORS){
    const live = S.motors?.[m.id], ram = S.ram?.[m.id], el = m.el;
    if(live?.online) online++;
    const err = live && (live.status || live.temp >= 55);
    el.querySelector('.dot').className = 'dot ' + (!live?.online || err ? 'off' : ram?.torque ? 'warn' : 'on');
    const d = live ? degOf(m.id, live.pos) : null;
    el.querySelector('.mval').textContent = !live?.online ? 'offline' : d == null ? `${live.pos}` : `${d.toFixed(1)}°`;
    el.querySelector('.tog').classList.toggle('on', !!ram?.torque);
  }
  $('#online').textContent = `${online}/8`;
  for(const sv of document.querySelectorAll('.sv')){
    const id = +sv.dataset.mid;
    if(sv.classList.contains('acc') && id !== openId) continue;
    renderSlider(sv, MOTORS[id-1], S.motors?.[id], S.ram?.[id], arcOf(id));
  }
}

function drawSpark(canvas){
  const h = hist[sel], dpr = devicePixelRatio, W = canvas.clientWidth * dpr, H = canvas.clientHeight * dpr;
  if(!W) return;
  canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d');
  g.strokeStyle = '#e4e7ec'; g.lineWidth = dpr; g.beginPath(); g.moveTo(0, H/2); g.lineTo(W, H/2); g.stroke();
  if(h.length < 2) return;
  const t0 = h[h.length-1].t - 10;
  const line = (key, color, lo, hi) => {
    g.strokeStyle = color; g.lineWidth = 1.5 * dpr; g.beginPath();
    h.forEach((s, i) => { const x = (s.t - t0) / 10 * W, y = H - 3*dpr - (Math.max(lo, Math.min(hi, s[key])) - lo) / (hi - lo) * (H - 6*dpr); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke();
  };
  const ps = h.map(s => s.pos); let lo = Math.min(...ps), hi = Math.max(...ps); if(hi - lo < 40){ const c = (hi + lo) / 2; lo = c - 20; hi = c + 20; }
  line('load', '#e8590c', -1000, 1000); line('cur', '#e03131', -1500, 1500); line('pos', '#1c7ed6', lo, hi);
}
function calibBars(){
  return MOTORS.map(m => {
    const r = S.rec?.[m.id], L = limits[m.joint];
    if(!r) return `<div class="crow"><span>${m.id}</span><div class="cbar"></div><span class="muted">—</span></div>`;
    const span = r.hi - r.lo, base = r.lo - Math.max(0, (4096 - span) / 2), W = 4096, pct = v => `${((v - base) / W * 100).toFixed(2)}%`;
    const expDeg = L ? (L.upper - L.lower) * 180 / Math.PI : 0, expSteps = expDeg / 360 * 4096, mid = (r.lo + r.hi) / 2, spanDeg = span * 360 / 4096;
    return `<div class="crow"><span>${m.id}</span><div class="cbar">
        ${expDeg ? `<div class="exp" style="left:${pct(mid - expSteps/2)};width:${(expSteps / W * 100).toFixed(2)}%"></div>` : ''}
        <div class="peak" style="left:${pct(r.plo ?? r.lo)};width:${(((r.phi ?? r.hi) - (r.plo ?? r.lo)) / W * 100).toFixed(2)}%"></div>
        <div class="fill" style="left:${pct(r.lo)};width:${(span / W * 100).toFixed(2)}%"></div>
        <div class="cur" style="left:${pct(r.acc)}"></div></div>
      <span style="color:${expDeg && spanDeg > expDeg * 0.8 ? 'var(--ok)' : 'var(--ink)'}">${spanDeg.toFixed(0)}°</span></div>`;
  }).join('');
}

let floorKey = null, floorMode = 'world';
function applyFloor(){
  const c = S?.camera || {}, af = c.auto_floor;
  // priority: locked marker floor > live marker > automatic (gravity + lowest horizontal surface) > raw ARKit
  let T = c.floor?.T || c.board?.T || null;
  if(!T && af) T = [[1, 0, 0, 0], [0, 1, 0, af.y], [0, 0, 1, 0], [0, 0, 0, 1]];
  const key = T ? JSON.stringify(T) : null;
  if(key === floorKey) return;
  floorKey = key;
  const mode = c.floor?.T ? 'locked' : c.board?.T ? 'live' : af ? 'auto' : 'world';
  if(mode !== floorMode){ floorMode = mode; camInfo.fitted = false; }  // re-fit only when the frame type changes
  world.matrixAutoUpdate = false;
  if(T){ const m = new THREE.Matrix4().set(...T.flat()); world.matrix.copy(m.invert()); }
  else world.matrix.identity();
  world.matrixWorldNeedsUpdate = true;
}

function connectCam(){

    cloudGeom.attributes.position.array.set(pos); cloudGeom.attributes.position.needsUpdate = true;
    cloudGeom.attributes.color.array.set(col); cloudGeom.attributes.color.needsUpdate = true;
    cloudGeom.setDrawRange(0, n);
    phone.matrix.fromArray(T); phone.matrixWorldNeedsUpdate = true; phone.visible = true;
    camInfo.T = new THREE.Matrix4().fromArray(T); camInfo.n = n;
    const now = performance.now(); camInfo._t.push(now); while(camInfo._t[0] < now - 1000) camInfo._t.shift(); camInfo.hz = camInfo._t.length;
    if(!camInfo.fitted && n > 500){ camInfo.fitted = true; fitCloud(); }

  const P = cloudGeom.attributes.position.array, step = Math.max(1, Math.floor(n / 4000)), ax = [[], [], []], q = new THREE.Vector3();
  for(let i = 0; i < n; i += step){

    if(Math.hypot(q.x, q.z) < 0.8){ ax[0].push(q.x); ax[1].push(q.y); ax[2].push(q.z); }

  const box = new THREE.Box3(new THREE.Vector3(...ax.map(a => pc(a, .1))), new THREE.Vector3(...ax.map(a => pc(a, .9))));

  if(!Object.values(S?.ram || {}).every(r => r.torque)){ toast('토크가 꺼진 모터가 있습니다 — 왼쪽 위 ON'); return; }
  send({...clickMsg('grasp_pick', pointScene), ...(objId ? {obj_id: objId} : {})});
  toast(`${label} 집기 — 계획 → 물리 예측 → 실행 (중단: STOP / Esc)`);
}
let hoverT = 0;
renderer.domElement.addEventListener('pointermove', e => {
  if(e.buttons || performance.now() - hoverT < 30) { if(e.buttons) tip.style.display = 'none'; return; }
  hoverT = performance.now();
  const h = rayHit(e, true), m = h?.object || null;
  setHover(m);
  const o = m && objInfo(m.userData.objId);
  if(o){
    tip.innerHTML = `<span class="ic">deployed_code</span> ${o.label ? esc(o.label.name) : '물체'} #${o.id} · ${shapeText(o)}${o.rms_mm != null ? ` (오차 ${o.rms_mm} mm)` : ''} · <span class="ic">mouse</span> 우클릭 집기`;
    tip.style.left = `${e.clientX + 14}px`; tip.style.top = `${e.clientY + 14}px`; tip.style.display = 'block';
  } else tip.style.display = 'none';
});
renderer.domElement.addEventListener('pointerleave', () => { setHover(null); tip.style.display = 'none'; });
renderer.domElement.addEventListener('pointerdown', e => { down = {x: e.clientX, y: e.clientY, b: e.button}; });
renderer.domElement.addEventListener('pointerup', e => {
  if(!down || down.b !== e.button || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 4 || gizmo.dragging) return;
  if(e.button === 0){                     // click: object → select + place-target gizmo · robot / world → registration gizmo
    if(gizmo.axis) return;                  // on the gizmo's own handles
    const h = rayHit(e, false), oid = h?.object?.userData.objId;
    const shown = o => { for(let x = o; x; x = x.parent) if(!x.visible) return false; return true; };
    const rr = robot ? raycaster.intersectObject(robot, true).find(i => i.object.isMesh && !i.object.userData.overlay && shown(i.object)) : null;  // rayHit set the ray
    if(rr && (!h || rr.distance < h.distance)){ setGizmo('robot'); toast('로봇 위치 기즈모 — W 이동 · E 회전 · 놓으면 정합 저장'); return; }
    if(oid){
      send({...clickMsg('grasp_select', h.point), obj_id: oid});
      if(placeTgt.objId !== oid || placeTgt.sent) makePlaceTarget(h.object);
      setGizmo('object'); toast('물체를 끌어 목표 위치로 → 반투명 목표 · 옮기기 실행 (Enter)');
      return;
    }
    const f = raycaster.intersectObject(floorPhoto, false)[0];
    if(h || f){ setGizmo('world'); toast('월드(iPhone 좌표) 위치 기즈모 — 놓으면 정합 저장'); return; }
    setGizmo('none');
  } else if(e.button === 2){                                // right click (no drag): grasp it right away
    const hasObjs = reconObjs.visible && reconObjs.children.length;
    const h = rayHit(e, hasObjs);
    if(!h){ toast(hasObjs ? '물체 위에서 우클릭하세요' : '복원 메시나 점군 위에서 우클릭하세요'); return; }
    pick(h.point, h.object.userData.objId ? `물체 #${h.object.userData.objId}` : '클릭한 곳', h.object.userData.objId);
  }
});
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

// left sidebar tabs: 모터 | 객체
function setLeftTab(k){
  document.querySelectorAll('#ltabs .tab').forEach(t => t.classList.toggle('on', t.dataset.l === k));
  document.querySelectorAll('#left .lpane').forEach(p => p.classList.toggle('on', p.dataset.l === k));
  try { localStorage.setItem('elrobot.left', k); } catch(e) {}
}
$('#ltabs').addEventListener('click', e => { const k = e.target.closest('[data-l]')?.dataset.l; if(k) setLeftTab(k); });
try { const k = localStorage.getItem('elrobot.left'); if(k) setLeftTab(k); } catch(e) {}
// 객체 tab: robot, iPhone, reconstructed objects — hover highlights, click selects/focuses, right-click or 집기 grasps
function focusOn(center, r = 0.12){
  const dir = camera.position.clone().sub(controls.target).normalize();
  controls.target.copy(center); camera.position.copy(center).add(dir.multiplyScalar(r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2))));
  controls.update();
}
const objTop = o => { world.updateMatrixWorld(true); return new THREE.Vector3(o.centre[0], o.centre[1] + o.size_mm[1] / 2000 - 0.004, o.centre[2]).applyMatrix4(world.matrixWorld); };
let hierKey = null;
function renderHier(){
  const objs = [...(S?.camera?.recon?.objects || [])].sort((a, b) => a.id - b.id), g = S?.grasp || {};   // stable order
  const stage = {planning: '계획 중', planned: '계획됨', executing: g.exec?.step ? `실행 ${g.exec.step}/${g.exec.of}` : '실행 중', done: '완료'}[g.stage] || '';
  const selC = g.object?.centre_base;
  const key = JSON.stringify([objs.map(o => [o.id, o.dims_mm, o.label?.name, o.label?.conf]), (S?.camera?.detect?.tracks || []).map(t => [t.id, t.hits]), stage, selC, S?.connected, S?.camera?.connected]);
  if(key === hierKey) return;
  hierKey = key;
  $('#obj-count').textContent = objs.length || '';
  const rows = [`<div class="gh">장치</div>`,
    `<div class="it" data-act="robot" title="시점 맞추기"><span class="ic">precision_manufacturing</span><span class="nm">ElRobot</span><span class="meta">${S?.connected ? (S.robot_source === 'virtual' ? '가상' : 'USB') : '끊김'}</span></div>`,
    `<div class="it" data-act="phone" title="iPhone 시점"><span class="ic">photo_camera</span><span class="nm">iPhone</span><span class="meta">${S?.camera?.connected ? S.camera.link : '없음'}</span></div>`,
    `<div class="gh">물체 ${objs.length ? `· ${objs.length}` : ''}</div>`,
    ...objs.map(o => `<div class="it" data-obj="${o.id}" title="클릭 선택 · 우클릭 집기"><span class="sw" style="background:#${OBJ_COLORS[o.id % OBJ_COLORS.length].toString(16).padStart(6, '0')}"></span>
      <span class="nm">${o.label ? `${esc(o.label.name)} <span class="meta">${Math.round(o.label.conf * 100)}%</span>` : `물체 #${o.id}`}<br><span class="meta">#${o.id} · ${shapeText(o)}${o.model_vs_geo ? ` · 일관성 AI ${o.model_vs_geo[0]} / 기하 ${o.model_vs_geo[1]}` : ''}</span></span>${o.inst ? `<button class="small icon" data-ai="${o.inst}" title="AI 복원 (TripoSR → 실제 크기 정렬)"><span class="ic">auto_awesome</span></button>` : ''}<button class="small" data-pick="${o.id}" title="바로 집기"><span class="ic">back_hand</span>집기</button></div>`)];
  const trks = S?.camera?.detect?.tracks || [];
  if(trks.length) rows.push(`<div class="gh">마스크 물체 · 깊이로 안 잡힘 · ${trks.length}</div>`, ...trks.map(t => `<div class="it" style="cursor:default" title="인식 마스크를 3D로 올려 융합한 점 (${t.points}점)">
      <span class="ic" style="color:var(--accent)">blur_on</span><span class="nm">${esc(t.name)} <span class="meta">×${t.hits}</span><br><span class="meta">${t.size_mm.join('×')} mm</span></span></div>`));
  if(!objs.length) rows.push(`<div class="it" style="cursor:default"><span class="ic" style="color:var(--ink3)">category</span><span class="meta">${S?.camera?.recon?.running ? '분리된 물체 없음' : '복원을 시작하세요'}</span></div>`);
  if(stage) rows.push(`<div class="gh">파지</div><div class="it" style="cursor:default"><span class="ic" style="color:var(--accent)">back_hand</span><span class="st">${stage}</span><span class="meta">${g.exec?.label || ''}</span></div>`);
  $('#hier-list').innerHTML = rows.join('');
}
$('#hier-list').addEventListener('mouseover', e => { const id = +e.target.closest('[data-obj]')?.dataset.obj; setHover(reconObjs.children.find(m => m.userData.objId === id) || null); });
$('#hier-list').addEventListener('mouseleave', () => setHover(null));
$('#hier-list').addEventListener('click', e => {
  const ab = e.target.closest('[data-ai]');
  if(ab){ send({type: 'detect_model', id: +ab.dataset.ai}); toast('AI 복원: 처음 누르면 생성(수 초~10초), 다시 누르면 AI ↔ 기하 전환'); return; }
  const pb = e.target.closest('[data-pick]');
  if(pb){ const o = objInfo(+pb.dataset.pick); if(o) pick(objTop(o), `물체 #${o.id}`, o.id); return; }
  const it = e.target.closest('.it'); if(!it) return;
  if(it.dataset.act === 'robot') return resetCam();
  if(it.dataset.act === 'phone') return viewFromPhone();
  const o = objInfo(+it.dataset.obj); if(!o) return;
  const p = objTop(o); focusOn(p); send({...clickMsg('grasp_select', p), obj_id: o.id});
  const m = reconObjs.children.find(x => x.userData.objId === o.id);
  if(m){ if(placeTgt.objId !== o.id || placeTgt.sent) makePlaceTarget(m); setGizmo('object'); }
});
$('#hier-list').addEventListener('contextmenu', e => {
  e.preventDefault();
  const o = objInfo(+e.target.closest('[data-obj]')?.dataset.obj); if(o) pick(objTop(o), `물체 #${o.id}`, o.id);
});

// selected object highlight (ARKit world points, so it lives under `world`)
const objGeom = new THREE.BufferGeometry();
const objPts = new THREE.Points(objGeom, new THREE.PointsMaterial({color: 0xe8590c, size: 0.003, map: DOT, transparent: true, opacity: 0.8, depthWrite: false, alphaTest: 0.05}));
objPts.frustumCulled = false; world.add(objPts);
let objVersion = -1;
// per-object TSDF (3 mm voxels) drawn over the selection; the points stay as the segmentation result
const objMesh = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshStandardMaterial({color: 0xe8590c, transparent: true, opacity: 0.55, roughness: .7}));
objMesh.visible = false; objMesh.renderOrder = 1; world.add(objMesh);
async function loadObject(){
  const buf = await (await fetch('/grasp_object')).arrayBuffer();
  if(buf.byteLength < 4){ objGeom.setDrawRange(0, 0); objMesh.visible = false; markSelected(); return; }
  const n = new Uint32Array(buf, 0, 1)[0];
  objGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(buf, 4, n * 3), 3));
  objGeom.setDrawRange(0, n);
  const mb = await (await fetch('/grasp_object_mesh')).arrayBuffer();
  if(mb.byteLength < 8){ objMesh.visible = false; return; }
  const [nv, nt] = new Uint32Array(mb, 0, 2);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(mb, 8, nv * 3), 3));
  g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(mb, 8 + nv * 12, nv * 3), 3));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(mb, 8 + nv * 24, nt * 3), 1));
  objMesh.geometry.dispose(); objMesh.geometry = g;
  objMesh.visible = nv > 0;
  markSelected();
}
// the selection is one of the separated objects: tint that object, drop the dot / overlay markers
let selObjId = null;
function markSelected(){
  const g = S?.grasp, pts = objGeom.attributes.position, n = objGeom.drawRange.count;
  selObjId = null;
  if(g?.object?.obj_id != null && reconObjs.children.some(m => m.userData.objId === g.object.obj_id)) selObjId = g.object.obj_id;
  else if(g?.object && pts && n){
    let cx = 0, cz = 0; for(let i = 0; i < n; i++){ cx += pts.getX(i); cz += pts.getZ(i); } cx /= n; cz /= n;
    const o = (S.camera?.recon?.objects || []).find(o => Math.hypot(o.centre[0] - cx, o.centre[2] - cz) < 0.03);
    selObjId = o?.id ?? null;
  }
  const onObj = selObjId !== null && reconObjs.visible;
  objPts.visible = !onObj; objMesh.visible = !onObj && objMesh.geometry.index?.count > 0;
  for(const m of reconObjs.children) m.material.emissive.setHex(baseEmissive(m));
}
const baseEmissive = m => m.userData.objId === selObjId ? 0x6b2a00 : 0x000000;
// planned gripper frame (base frame) → axes + pre-grasp line under the robot
const graspAxes = new THREE.AxesHelper(0.06); graspAxes.matrixAutoUpdate = false; graspAxes.visible = false;
let graspPlanKey = null;
function renderGrasp(){
  const g = S?.grasp; if(!g) return;
  loadRegistration();
  if(g.obj_version !== objVersion){ objVersion = g.obj_version; loadObject(); }
  syncGhost(g.plan); watchExecution(g); watchPlace(g); applyVirtualMoved();
  const key = JSON.stringify(g.plan?.frame || null);
  if(key !== graspPlanKey && robot){
    graspPlanKey = key;
    if(!graspAxes.parent) robot.add(graspAxes);
    if(g.plan?.frame){ graspAxes.matrix.fromArray(g.plan.frame.flat()).transpose(); graspAxes.visible = true; }
    else graspAxes.visible = false;
  }
}
// predicted object (MuJoCo, base frame) shown semi-transparent while the plan replays
const ghost = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshStandardMaterial({color: 0x2f9e44, transparent: true, opacity: 0.38, depthWrite: false}));
ghost.visible = false; ghost.userData.overlay = true; ghost.renderOrder = 2;
let ghostKey = null, playing = null;
function syncGhost(p){
  const sim = p?.sim, key = sim?.frames ? JSON.stringify(sim.hull.v.length) + sim.frames.length + sim.lift_mm : null;
  if(key === ghostKey) return;
  ghostKey = key;
  if(robot && !ghost.parent) robot.add(ghost);
  if(!sim?.frames){ ghost.visible = false; return; }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(sim.hull.v.flat(), 3));
  g.setIndex(sim.hull.f.flat()); g.computeVertexNormals();
  ghost.geometry.dispose(); ghost.geometry = g;
  ghost.material.color.set(sim.held ? 0x2f9e44 : sim.lift_mm > 5 ? 0xe8590c : 0xe03131);
  placeGhost(sim.frames[0]); ghost.visible = true;
}
function placeGhost(f){ ghost.position.set(f[1], f[2], f[3]); ghost.quaternion.set(f[5], f[6], f[7], f[4]); }  // MuJoCo quat = w x y z
const hud = $('#simhud'), H = k => hud.querySelector(`[data-h="${k}"]`);
function showHud(f, sim, mode, z0){
  hud.classList.add('show');
  H('mode').textContent = mode;
  H('t').textContent = `${f[0].toFixed(1)} s`;
  H('f').textContent = f.length > 16 ? `${f[16].toFixed(1)} N` : '-';
  H('z').textContent = `${((f[3] - z0) * 1000).toFixed(0)} mm`;
  const vd = H('vd'); vd.textContent = sim.verdict;
  vd.style.background = sim.held ? 'var(--ok)' : sim.lift_mm > 5 ? 'var(--accent)' : 'var(--bad)';
}
const poseOf = f => new THREE.Matrix4().compose(new THREE.Vector3(f[1], f[2], f[3]), new THREE.Quaternion(f[5], f[6], f[7], f[4]), new THREE.Vector3(1, 1, 1));
function followMesh(frames){   // the executing object's own mesh follows the prediction (base-frame pose → world group)
  if(!realCam() || selObjId === null || !robot) return null;
  const m = reconObjs.children.find(x => x.userData.objId === selObjId); if(!m) return null;
  world.updateMatrixWorld(true); robot.updateMatrixWorld(true);
  const W = world.matrixWorld.clone(), Wi = W.clone().invert(), B = robot.matrixWorld.clone(), Bi = B.clone().invert();
  const prev = m.matrix.clone(), P0i = poseOf(frames[0]).invert();
  m.userData.animating = true; m.matrixAutoUpdate = false;
  return f => { m.matrix.copy(Wi).multiply(B).multiply(poseOf(f)).multiply(P0i).multiply(Bi).multiply(W).multiply(prev); m.matrixWorldNeedsUpdate = true; };
}
function playSim(frames, speed = 1){      // replay the prediction: virtual robot (simulated joints) + object
  const sim = S?.grasp?.plan?.sim || {}, t0 = performance.now(), T = frames[frames.length - 1][0], z0 = frames[0][3];
  const follow = speed === 1 ? followMesh(frames) : null;
  if(follow) ghost.visible = false;
  const mode = speed === 1 ? '실행 예측' : `미리보기 ×${speed}`;
  playing = t0;
  (function step(){
    if(playing !== t0) return;
    // during a real run follow the executor's own clock (its ticks run slower than wall time)
    const ex = speed === 1 ? S?.grasp?.exec : null;
    const t = ex?.t !== undefined && S.grasp.stage === 'executing' ? ex.t : (performance.now() - t0) / 1000 * speed;
    if(t > T){
      const f = frames[frames.length - 1]; placeGhost(f); setGhostQ(f.slice(8, 16)); showHud(f, sim, mode, z0); playing = null;
      if(follow){ follow(f); for(const m of reconObjs.children) m.userData.animating = false; }
      setTimeout(() => { if(playing === null){ setGhostQ(null); hud.classList.remove('show'); } }, 2500);
      return;
    }
    const f = frames[Math.min(frames.length - 1, Math.floor(t * 20))];
    placeGhost(f); setGhostQ(f.slice(8, 16)); showHud(f, sim, mode, z0); follow?.(f);
    requestAnimationFrame(step);
  })();
}
let lastStage = null;
function watchExecution(g){
  if(g.stage === 'executing' && lastStage !== 'executing' && g.plan?.sim?.frames) playSim(g.plan.sim.frames, 1);
  lastStage = g.stage;
}
function playPreview(){
  const p = S?.grasp?.plan; if(!p?.q_grasp) return;
  if(p.sim?.frames){ playSim(p.sim.frames, 2); return; }   // 2× real time
  const keys = [[...p.q_now], [...p.q_pre, 0], [...p.q_grasp, 0], [...p.q_grasp, 2.2], [...p.q_lift, 2.2]];
  const seg = 1200, t0 = performance.now();
  (function step(){
    const t = (performance.now() - t0) / seg, i = Math.floor(t);
    if(i >= keys.length - 1){ setGhostQ(null); return; }
    let s = t - i; s = s * s * (3 - 2 * s);
    setGhostQ(keys[i].map((a, k) => a + (keys[i + 1][k] - a) * s));
    requestAnimationFrame(step);
  })();
}
insetsReady = true;
</script>
